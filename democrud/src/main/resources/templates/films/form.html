<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario película</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Formulario película</h2>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<form th:action="@{/films/guardar}" th:object="${film}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Título</label>
        <input type="text" th:field="*{title}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Descripción</label>
        <textarea th:field="*{description}" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label>Idioma</label>
        <select th:field="*{language.id}" class="form-select" required>
            <option value="">-- Selecciona --</option>
            <option th:each="l : ${idiomas}" th:value="${l.id}" th:text="${l.name}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label>Duración (min)</label>
        <input type="number" th:field="*{length}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Días de renta</label>
        <input type="number" th:field="*{rentalDuration}" class="form-control" placeholder="3"/>
    </div>

    <div class="mb-3">
        <label>Tarifa de renta</label>
        <input type="number" step="0.01" th:field="*{rentalRate}" class="form-control" placeholder="4.99"/>
    </div>

    <div class="mb-3">
        <label>Clasificación</label>
        <select th:field="*{rating}" class="form-select">
            <option value="G">G</option>
            <option value="PG">PG</option>
            <option value="PG-13">PG-13</option>
            <option value="R">R</option>
            <option value="NC-17">NC-17</option>
        </select>
    </div>

    <button class="btn btn-success">Guardar</button>
    <a th:href="@{/films}" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
