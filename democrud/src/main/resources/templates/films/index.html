<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Peliculas (Sakila DB) - David Efrain Jose Ramos</h2>

<div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<a th:href="@{/films/nuevo}" class="btn btn-primary mb-3">Nueva película</a>

<table class="table table-bordered table-sm">
    <thead>
        <tr>
            <th>ID</th><th>Título</th><th>Idioma</th><th>Duración</th>
            <th>Clasificación</th><th>Tarifa</th><th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="f : ${page.content}">
            <td th:text="${f.id}"></td>
            <td th:text="${f.title}"></td>
            <td th:text="${f.language.name}"></td>
            <td th:text="${f.length}"></td>
            <td th:text="${f.rating}"></td>
            <td th:text="${f.rentalRate}"></td>
            <td>
                <a th:href="@{/films/editar/{id}(id=${f.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/films/eliminar/{id}(id=${f.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar esta película?');">
                    <button class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<div class="d-flex gap-2 align-items-center">
    <a class="btn btn-outline-secondary btn-sm" th:if="${page.hasPrevious()}"
       th:href="@{/films(page=${page.number - 1})}">« Anterior</a>
    <span th:text="'Página ' + ${page.number + 1} + ' de ' + ${page.totalPages}"></span>
    <a class="btn btn-outline-secondary btn-sm" th:if="${page.hasNext()}"
       th:href="@{/films(page=${page.number + 1})}">Siguiente »</a>
</div>

</body>
</html>
